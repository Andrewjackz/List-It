<style>
/* Layout: one narrow column; three screens (all lists, review a scan, one checklist). Light only, by choice. */
:root{
  --paper:#FBFAF5; --surface:#FFFFFF; --ink:#14315E; --muted:#5A6A84; --line:#DCE1EA;
  --red:#B5322A; --red-soft:#FBEDEB; --green:#1F7A4A; --green-soft:#EAF5EE; --blue-soft:#EAF0F8;
  --amber:#8A5A00; --amber-soft:#FFF4D6;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Public Sans","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
h1{font-family:var(--display);font-weight:800;font-size:1.75rem;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:32px 0 10px}
.sync{font-size:.8rem;color:var(--muted)}
.sync.ok::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:1px}
.sync.bad{color:var(--red)}
.btn{font:600 .95rem var(--body);border-radius:10px;padding:10px 16px;cursor:pointer;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.navy{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{border-color:var(--line)}
.btn.small{padding:5px 10px;font-size:.82rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.actions{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:20px}
.actions .btn{padding:16px;font-size:1rem}
.camera{position:relative;overflow:hidden}
.camera input{position:absolute;inset:0;opacity:0;cursor:pointer}
.hint{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.cards{display:flex;flex-direction:column;gap:10px}
.lcard{text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;font:inherit;color:inherit}
.lcard .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.lcard .ttl{font-weight:600;font-size:1.05rem;overflow-wrap:anywhere;min-width:0}
.count{font-family:var(--mono);font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--green);transition:width .25s}
.date{font-size:.8rem;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px}
details.arch{margin-top:28px}
details.arch summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:1.05rem;padding:6px 0}
.arow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.arow .ttl{flex:1;min-width:140px;cursor:pointer;overflow-wrap:anywhere}
.back{background:none;border:0;color:var(--ink);font:600 .95rem var(--body);cursor:pointer;padding:6px 0;display:inline-flex;gap:6px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:14px}
ol.items{list-style:none;margin:0;padding:0}
ol.items li{border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 8px 8px 6px;min-height:48px}
ol.items li:first-child{border-top:0}
ol.items li.done{background:var(--green-soft)}
ol.items li.unsure{background:var(--amber-soft)}
.no{font-family:var(--mono);font-size:.8rem;color:var(--muted);width:1.6em;text-align:right;flex:none}
.check{flex:none;width:22px;height:22px;border:2px solid var(--ink);border-radius:5px;background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.done .check{background:var(--green);border-color:var(--green)}
.check svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.done .check svg{opacity:1}
.txt{flex:1;min-width:0;cursor:pointer;overflow-wrap:anywhere}
.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--green)}
.tools{display:flex;gap:4px;flex:none}
.icon{width:34px;height:34px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;font:600 1rem var(--body);display:grid;place-items:center;padding:0}
.icon.del{color:var(--red)}
.icon:disabled{opacity:.35}
input.t,textarea.t{font:500 1rem var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;box-sizing:border-box}
textarea.t{min-height:180px;resize:vertical;line-height:1.5}
input.title{font:600 1.15rem var(--body)}
.add{display:flex;gap:8px;padding:12px 14px;border-top:1px dashed var(--line)}
.flag{font:600 .7rem var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--amber);background:var(--surface);border:1px solid var(--amber);border-radius:999px;padding:2px 7px;flex:none}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.photos img{max-width:100%;max-height:220px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.photos.full img{max-height:none;width:100%}
.status{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding:14px 16px;background:var(--blue-soft);border-radius:10px}
.status.err{background:var(--red-soft);color:var(--red)}
.status.good{background:var(--green-soft);color:var(--green)}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp 0.9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--red);font-size:.9rem}
.lhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-top:6px}
.lhead h1{font-size:1.5rem;overflow-wrap:anywhere;min-width:0}
.bar{display:flex;align-items:center;gap:12px;margin-top:12px}
.bar .track{flex:1;height:8px}
.legend{font-size:.82rem;color:var(--amber);margin:10px 0 0}
ol.items li.menu{background:var(--blue-soft);flex-wrap:wrap;gap:8px;padding:10px 14px 10px 52px;border-top:0}
ol.items li.insert{background:var(--blue-soft)}
.grip{flex:none;width:26px;height:40px;margin:-6px -6px -6px -8px;border:0;background:none;color:var(--muted);cursor:grab;touch-action:none;display:grid;place-items:center;padding:0;font-size:1.15rem;line-height:1;-webkit-user-select:none;user-select:none}
.grip:active{cursor:grabbing}
ol.items li.dragging{position:relative;z-index:3;background:var(--surface);outline:2px solid var(--ink);outline-offset:-2px;box-shadow:0 8px 22px rgba(20,49,94,.22)}
ol.items li.dragging .grip{color:var(--ink)}
select.pos{flex:none;width:auto;min-width:2.6em;text-align:center;text-align-last:center;font:500 .85rem var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:7px;padding:4px 4px;cursor:pointer;-webkit-appearance:none;appearance:none}
select.pos:hover{border-color:var(--ink)}
select.pos:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.lrow select.pos{align-self:center}
.lrow{display:flex;align-items:center;gap:4px}
.lrow .ctrl{align-self:center}
.lrow .lcard{flex:1;min-width:0}
.lrow.dragging{position:relative;z-index:3}
.lrow.dragging .lcard{outline:2px solid var(--ink);box-shadow:0 8px 22px rgba(20,49,94,.22)}
.lrow.dragging .grip{color:var(--ink)}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:9px;overflow-x:auto;margin-top:14px;max-width:100%}
.seg button{font:600 .82rem var(--body);background:var(--surface);color:var(--ink);border:0;border-left:1.5px solid var(--ink);padding:7px 10px;cursor:pointer;white-space:nowrap;flex:none}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg .c{font-family:var(--mono);font-size:.75rem;opacity:.8;margin-left:5px;font-variant-numeric:tabular-nums}
/* frozen top bar: back link, list name, add button stay visible while scrolling */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;
  margin:-20px -16px 0;padding:8px 16px;background:var(--paper);border-bottom:1.5px solid var(--line)}
.topbar .back{flex:none;padding:8px 0}
.topbar .tb-title{flex:1;min-width:0;font-weight:600;font-size:.9rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .btn{flex:none}
.putat{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);margin-right:auto}
.putat select.pos{font-size:.8rem;padding:5px 8px;min-width:0}
ol.items li.filterempty{justify-content:center;color:var(--muted);padding:22px 14px}
/* slim control column: position number on top, drag handle beneath */
.ctrl{flex:none;width:28px;display:flex;flex-direction:column;align-items:center;gap:2px}
.ctrl .no{width:auto;text-align:center}
.ctrl select.pos{width:28px;min-width:0;font-size:.72rem;padding:2px 0;border-radius:5px;line-height:1.2}
.ctrl .grip{margin:0;width:28px;height:22px;font-size:.95rem}
.icon.more{width:26px;background:transparent}
ol.items li.menu{padding-left:42px}
body.drag-on{-webkit-user-select:none;user-select:none;cursor:grabbing}
textarea.t.wrap{min-height:0;resize:none;overflow:hidden;line-height:1.4;display:block;white-space:pre-wrap;overflow-wrap:anywhere}
ol.items li.editing,ol.items li.insert{flex-wrap:wrap;align-items:flex-start}
ol.items li.editing .txt,ol.items li.insert .txt{flex:1 1 0;min-width:0}
ol.items li.editing .tools,ol.items li.insert .tools{width:100%;justify-content:flex-end;gap:8px}
ol.items li.editing .no,ol.items li.insert .no{padding-top:11px}
ol.items li.insert .tools,ol.items li .tools .btn{flex:none}
.icon.more{border-color:transparent;font-size:1.2rem;color:var(--muted)}
.icon.more[aria-expanded="true"]{border-color:var(--line);background:var(--blue-soft);color:var(--ink)}
.due{font:600 .75rem var(--body);border-radius:999px;padding:2px 9px;background:var(--blue-soft);color:var(--ink);white-space:nowrap}
.due.soon{background:var(--amber-soft);color:var(--amber)}
.due.late{background:var(--red-soft);color:var(--red)}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.toolbar .camera{position:relative;overflow:hidden}
.copied{font-size:.85rem;color:var(--green);align-self:center}
textarea.copybox{min-height:120px;font-family:var(--body);font-size:.9rem;margin-top:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);margin-top:12px;max-width:240px}
.fieldrow{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
@media (max-width:420px){.actions{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.fill{transition:none}.spin{animation:none}}
</style>

<body>
<div class="wrap" id="app"></div>
<div class="wrap" id="backup-wrap" style="padding-block:0 48px">
  <details class="arch" id="backup">
    <summary>Backup</summary>
    <p class="hint">Your lists are stored only on this phone. Save a backup now and then (Files app or iCloud Drive) so you can restore them if Safari's data is cleared.</p>
    <div class="row">
      <button class="btn small navy" id="bk-export" type="button">Save backup</button>
      <label class="btn small camera" style="position:relative;overflow:hidden">Restore from backup
        <input type="file" id="bk-import" accept="application/json,.json" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>
    </div>
    <p class="hint" id="bk-msg" aria-live="polite"></p>
  </details>
</div>

<script>
/* Phone-only storage: lists live in this browser's localStorage */
(function(){
  const KEY="listit.lists";
  const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){return {}}};
  const store=m=>{localStorage.setItem(KEY,JSON.stringify(m))};
  const subs=new Set();
  const snap=()=>{const m=load();return {docs:Object.entries(m).map(([id,d])=>({id,data:()=>d}))}};
  const emit=()=>{const sn=snap();subs.forEach(f=>{try{f(sn)}catch(e){console.error(e)}})};
  window.addEventListener("storage",e=>{if(e.key===KEY)emit()});
  const db={
    collection:()=>({onSnapshot:(cb)=>{subs.add(cb);setTimeout(()=>cb(snap()),0);return()=>subs.delete(cb)}}),
    doc:path=>{const id=String(path).split("/")[1];return{
      set:async body=>{try{const m=load();m[id]=body;store(m)}catch(e){throw {code:"quota_exceeded",message:String(e)}}setTimeout(emit,0)},
      delete:async()=>{const m=load();delete m[id];store(m);setTimeout(emit,0)}}}
  };
  window.claude={use:async n=>n==="db"?db:null};
  window.__listitStore={load,store,emit,KEY};
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
</script>
<script>
let db=null,assets=null,sample=null,imgLimits=null,live=false,dbFailed=false;
let lists=[];
let savedFilter="all";try{const f=localStorage.getItem("photolists.filter");if(f==="todo"||f==="done"||f==="recent")savedFilter=f}catch(e){}
/* "Recent" view: hide items ticked more than 7 days ago (items with no tick date count as recent) */
const OLD_MS=7*864e5;
const isOld=it=>!!(it.done&&it.doneAt&&(Date.now()-new Date(it.doneAt).getTime())>OLD_MS);
const hiddenBy=(f,it)=>(f==="todo"&&it.done)||(f==="done"&&!it.done)||(f==="recent"&&isOld(it));
const st={filter:savedFilter,view:"home",openId:null,edit:false,confirm:null,showPhoto:false,review:null,banner:null,pending:false};
const writes={};

function h(tag,attrs,...kids){const el=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){
    if(v==null||v===false)continue;
    if(k.startsWith("on"))el.addEventListener(k.slice(2),v);
    else if(k==="class")el.className=v;
    else el.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)))}
  return el}
/* auto-growing text box: wraps long items, one line per item (Enter saves, pasted line breaks become spaces) */
function area(attrs){
  const v=attrs.value||"";const a={...attrs};delete a.value;
  const ta=h("textarea",{...a,class:"t wrap",rows:"1"});ta.value=v;
  const fit=()=>{ta.style.height="auto";ta.style.height=ta.scrollHeight+2+"px"};
  ta.addEventListener("keydown",e=>{if(e.key==="Enter")e.preventDefault()});
  ta.addEventListener("input",()=>{if(/[\r\n]/.test(ta.value)){const p=ta.selectionStart;ta.value=ta.value.replace(/\s*[\r\n]+\s*/g," ");try{ta.setSelectionRange(p,p)}catch(e){}}fit()});
  requestAnimationFrame(fit);setTimeout(fit,60);
  return ta}
window.addEventListener("resize",()=>document.querySelectorAll("textarea.wrap").forEach(t=>{t.style.height="auto";t.style.height=t.scrollHeight+2+"px"}));
/* drag to reorder: hold the ⠿ handle and move; works with mouse and touch */
/* position picker: tap the number, pick a new position (phones show a native scroll wheel) */
function posSelect(ix,n,label,onMove){
  if(n<2)return h("span",{class:"no"},ix+1);
  const s=h("select",{class:"no pos","aria-label":"Move "+label+" to position",title:"Move to position",
    onchange:e=>{const to=Number(e.target.value);if(to!==ix)onMove(to)}});
  for(let i=0;i<n;i++){const o=document.createElement("option");o.value=String(i);o.textContent=String(i+1);if(i===ix)o.selected=true;s.append(o)}
  return s}
function ctrl(...kids){return h("div",{class:"ctrl"},...kids)}
function grip(){return h("button",{class:"grip",type:"button","aria-label":"Drag to move",title:"Drag to move"},"⠿")}
function wireDrag(ol,onDrop){
  ol.querySelectorAll(":scope > [data-k] > .grip, :scope > [data-k] > .ctrl > .grip").forEach(g=>{
    const li=g.closest("[data-k]");
    g.addEventListener("pointerdown",e=>{
      if(e.button>0)return;
      e.preventDefault();
      try{g.setPointerCapture(e.pointerId)}catch(_){}
      st.dragging=true;st.menu=null;
      ol.querySelectorAll(":scope > :not([data-k])").forEach(x=>x.remove());
      document.body.classList.add("drag-on");li.classList.add("dragging");
      const rows=()=>[...ol.querySelectorAll(":scope > [data-k]")];
      const start=rows().map(r=>r.dataset.k).join("|");
      let lastY=e.clientY,raf=0;
      const renum=()=>rows().forEach((r,i)=>{const n=r.querySelector(".no");if(!n)return;if(n.tagName==="SELECT")n.value=String(i);else n.textContent=i+1});
      const place=y=>{
        const others=rows().filter(r=>r!==li);
        const t=others.find(r=>{const b=r.getBoundingClientRect();return y<b.top+b.height/2});
        if(t){if(li.nextElementSibling!==t){ol.insertBefore(li,t);renum()}}
        else{const last=others[others.length-1];if(last&&last.nextElementSibling!==li){last.after(li);renum()}}
      };
      const tick=()=>{const m=70;let d=0;
        if(lastY<m)d=-Math.ceil((m-lastY)/5);else if(lastY>innerHeight-m)d=Math.ceil((lastY-(innerHeight-m))/5);
        if(d){scrollBy(0,d);place(lastY)}raf=requestAnimationFrame(tick)};
      raf=requestAnimationFrame(tick);
      const move=ev=>{lastY=ev.clientY;place(lastY)};
      const end=()=>{
        cancelAnimationFrame(raf);
        g.removeEventListener("pointermove",move);g.removeEventListener("pointerup",end);g.removeEventListener("pointercancel",end);
        document.body.classList.remove("drag-on");li.classList.remove("dragging");
        st.dragging=false;st.pending=false;
        const order=rows().map(r=>r.dataset.k);
        if(order.join("|")!==start)onDrop(order);else render();
      };
      g.addEventListener("pointermove",move);g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);
    });
  });
}
const rid=()=>Math.random().toString(36).slice(2,10);
const fmt=iso=>iso?new Date(iso).toLocaleString(undefined,{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"";
const fmtDay=iso=>iso?new Date(iso).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):"";
function dueInfo(due){
  if(!due||!/^\d{4}-\d{2}-\d{2}$/.test(due))return null;
  const[y,m,d]=due.split("-").map(Number);const dt=new Date(y,m-1,d);const t=new Date();t.setHours(0,0,0,0);
  const diff=Math.round((dt-t)/864e5);const day=dt.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
  const label=diff<0?"Overdue · "+day:diff===0?"Due today":diff===1?"Due tomorrow":"Due "+day;
  return{diff,label,cls:diff<=0?"late":diff<=3?"soon":""}}
function duePill(due){const i=dueInfo(due);return i?h("span",{class:"due "+i.cls},i.label):null}
const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
function listText(l,remainingOnly){
  const lines=[l.title||"Untitled list"];const i=dueInfo(l.due);if(i)lines.push(i.label);lines.push("");
  (l.items||[]).filter(x=>!remainingOnly||!x.done).forEach(x=>lines.push((x.done?"☑ ":"☐ ")+x.text));
  return lines.join("\n")}
function copyList(l,remainingOnly){
  const t=listText(l,remainingOnly);
  const done=()=>{st.copied=remainingOnly?"left":"all";st.copyFallback=null;render();setTimeout(()=>{st.copied=null;render()},2500)};
  try{navigator.clipboard.writeText(t).then(done,()=>{st.copyFallback=t;render()})}catch(e){st.copyFallback=t;render()}

async function toJpeg(file){
  try{const bmp=await createImageBitmap(file);const max=2000,sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));return b||file}catch(e){return file}
}
const PROMPT=`The attached photo(s) show a handwritten or printed to-do list. Turn it into checklist items.
Rules:
- One item per list entry, in the order written. Multiple photos are consecutive pages of one list.
- Keep the writer's wording; fix obvious misspellings only.
- Drop item numbers, bullets and ticks. Skip anything crossed out.
- If an entry wraps onto the next line, join it into one item.
- If any part of an entry is hard to read, give your best reading and set "unsure": true.
- If the list has a heading, use it as the title; otherwise suggest a 2-4 word title.
Reply with only JSON in this shape: {"title":"Garage clear-out","items":[{"text":"Take paint to tip","unsure":false}]}
If no list is visible, reply {"title":"","items":[]}.`;
let scanCtl=null;
async function startScan(files,mergeInto){
  st.review={mode:"photo",status:"reading",title:"",items:[],photos:[],urls:[],mergeInto:mergeInto||null,due:""};st.view="review";render();window.scrollTo(0,0);
  const blobs=[];for(const f of files)blobs.push(await toJpeg(f));
  st.review.photos=blobs;st.review.urls=blobs.map(b=>URL.createObjectURL(b));render();
  runScan();
}
async function runScan(){
  const r=st.review;if(!r)return;r.status="reading";r.error=null;render();
  scanCtl=new AbortController();const mine=r;
  try{
    const out=await sample.json(PROMPT,{images:r.photos,signal:scanCtl.signal,modelTier:"default"});
    if(st.review!==mine)return;
    let items=Array.isArray(out&&out.items)?out.items.filter(i=>i&&String(i.text||"").trim()).map(i=>({key:rid(),text:String(i.text).trim(),unsure:!!i.unsure})):[];
    const found=items.length;r.skipped=0;
    const target=r.mergeInto&&getList(r.mergeInto);
    if(target){const have=new Set((target.items||[]).map(x=>norm(x.text)));items=items.filter(i=>!have.has(norm(i.text)));r.skipped=found-items.length}
    r.title=String((out&&out.title)||"").trim();r.items=items;
    r.status=items.length?"ready":"error";
    r.error=items.length?null:found&&target?"Everything in the photo is already on this list.":"No list items found in the photo. Try a straighter, brighter photo, or type the list.";
  }catch(e){
    if(st.review!==mine)return;
    if(e&&e.code==="cancelled"){r.status="error";r.error="Stopped.";}
    else r.status="error",r.error=({not_granted:"Photo reading needs your permission. Allow it when asked, or type the list.",

      session_expired:"Your sign-in expired. Reload the page and sign in."})[e&&e.code]||"Couldn't read the photo. Check your signal and try again.";
  }

}

    if(st.edit){
      row.append(h("div",{class:"txt",style:"cursor:auto"},area({id:"li-"+it.id,value:it.text,"aria-label":"Item "+(ix+1),
        onchange:e=>{const v=e.target.value.trim();if(v&&v!==it.text)saveList({...l,items:items.map(x=>x.id===it.id?{...x,text:v}:x)})},
        onkeydown:e=>{if(e.key==="Enter")e.target.blur()}})));
      if(st.confirm==="item-"+it.id)row.append(h("div",{class:"confirm"},
        h("button",{class:"btn small primary",onclick:()=>{st.confirm=null;saveList({...l,items:items.filter(x=>x.id!==it.id)});render()}},"Delete"),
        h("button",{class:"btn small ghost",onclick:()=>{st.confirm=null;render()}},"Keep")));
      else row.append(h("div",{class:"tools"},
        h("button",{class:"icon","aria-label":"Move up",disabled:ix===0,onclick:()=>move(l,ix,ix-1)},"↑"),
        h("button",{class:"icon","aria-label":"Move down",disabled:ix===n-1,onclick:()=>move(l,ix,ix+1)},"↓"),
        h("button",{class:"icon del","aria-label":"Delete item",onclick:()=>{st.confirm="item-"+it.id;render()}},"×")));
    }else if(st.editing===it.id){
      const save=()=>{const el=document.getElementById("ed-"+it.id);const v=(el&&el.value||"").trim();st.editing=null;st.pending=false;
        if(v&&v!==it.text)saveList({...l,items:items.map(x=>x.id===it.id?{...x,text:v}:x)});render()};
      row.classList.add("editing");
      row.append(h("div",{class:"txt",style:"cursor:auto"},area({id:"ed-"+it.id,value:it.text,"aria-label":"Edit item "+(ix+1),
          onkeydown:e=>{if(e.key==="Enter")save();if(e.key==="Escape"){st.editing=null;render()}}})),
        h("div",{class:"tools"},h("button",{class:"btn small navy",onclick:save},"Save"),
          h("button",{class:"btn small ghost",onclick:()=>{st.editing=null;st.pending=false;render()}},"Cancel")));
    }else{
      const toggle=()=>toggleItem(l,it.id);
      row.append(h("button",{class:"check","aria-label":(it.done?"Untick ":"Tick ")+it.text,"aria-pressed":String(!!it.done),onclick:toggle},tickSvg()),
        h("div",{class:"txt",onclick:toggle},it.text),
        h("button",{class:"icon more","aria-label":"Options for "+it.text,"aria-expanded":String(st.menu===it.id),
          onclick:()=>{st.menu=st.menu===it.id?null:it.id;st.confirm=null;render()}},"⋯"));
    }
    ol.append(row);
    if(!st.edit&&st.menu===it.id&&st.editing!==it.id){
      ol.append(h("li",{class:"menu"},
        h("button",{class:"btn small",onclick:()=>{st.menu=null;st.inserting=null;st.editing=it.id;render();focusSoon("ed-"+it.id)}},"Edit"),
        h("button",{class:"btn small",onclick:()=>{st.menu=null;st.editing=null;st.inserting={at:ix};render();focusSoon("ins-text")}},"Add above"),
        h("button",{class:"btn small",onclick:()=>{st.menu=null;st.editing=null;st.inserting={at:ix+1};render();focusSoon("ins-text")}},"Add below"),
        st.confirm==="item-"+it.id
          ?h("span",{class:"confirm"},h("button",{class:"btn small primary",onclick:()=>{st.confirm=null;st.menu=null;saveList({...l,items:items.filter(x=>x.id!==it.id)});render()}},"Delete"),
              h("button",{class:"btn small ghost",onclick:()=>{st.confirm=null;render()}},"Keep"))
          :h("button",{class:"btn small ghost",style:"color:var(--red)",onclick:()=>{st.confirm="item-"+it.id;render()}},"Delete")));
    }
  });
  if(!st.edit&&st.inserting&&st.inserting.at>=n)ol.append(insRow(n));
  if(n&&!ol.querySelector("[data-k]")&&!st.inserting)ol.append(h("li",{class:"filterempty"},st.filter==="todo"?"Nothing outstanding. Everything is ticked."
    :st.filter==="recent"?"Nothing outstanding, and nothing ticked in the last 7 days.":"Nothing ticked yet."));
  /* drop: re-slot only the visible items, hidden (filtered-out) items keep their positions */
  wireDrag(ol,order=>{const cur=getList(l.id)||l;const its=[...(cur.items||[])];
    const slots=its.map((x,i)=>order.includes(x.id)?i:-1).filter(i=>i>=0);
    const byId=Object.fromEntries(its.map(x=>[x.id,x]));
    order.forEach((id,k)=>{if(byId[id]&&slots[k]!=null)its[slots[k]]=byId[id]});
    st.inserting=null;saveList({...cur,items:its});render()});
  const card=h("section",{class:"card"},n||st.inserting?ol:h("div",{class:"empty",style:"border:0"},"No items yet.",h("div",{class:"row",style:"justify-content:center"},
    h("button",{class:"btn small",onclick:()=>{st.inserting={at:0};render();focusSoon("ins-text")}},"Add an item"))));
  if(st.edit){const add=()=>{const el=document.getElementById("ls-add");const v=el.value.trim();if(!v)return;el.value="";
      saveList({...l,status:"active",archivedAt:null,items:[...items,{id:rid(),text:v,done:false,doneAt:null}]});render();setTimeout(()=>document.getElementById("ls-add")?.focus(),0)};
    card.append(h("div",{class:"add"},h("input",{class:"t",id:"ls-add",placeholder:"New item","aria-label":"New item",onkeydown:e=>{if(e.key==="Enter")add()}}),h("button",{class:"btn",onclick:add},"Add")))}
  app.append(card);

  const foot=h("div",{class:"row",style:"margin-top:20px"});
  if(st.confirm==="list")foot.append(h("div",{class:"confirm"},"Delete this list and its photo for good?",
    h("button",{class:"btn small primary",onclick:()=>deleteList(l)},"Delete"),
    h("button",{class:"btn small ghost",onclick:()=>{st.confirm=null;render()}},"Keep")));
  else{
    if(l.status!=="archived")foot.append(h("button",{class:"btn small",onclick:()=>{saveList({...l,status:"archived",archivedAt:new Date().toISOString()});st.banner=null;render()}},"Archive now"));
    foot.append(h("button",{class:"btn small ghost",style:"color:var(--red)",onclick:()=>{st.confirm="list";render()}},"Delete list"));
  }
  app.append(foot);
}
function toggleItem(l,id){
  const items=l.items.map(x=>x.id===id?{...x,done:!x.done,doneAt:x.done?null:new Date().toISOString()}:x);
  const all=items.length&&items.every(x=>x.done);
  let next={...l,items};
  if(all&&l.status!=="archived"){next.status="archived";next.archivedAt=new Date().toISOString();st.banner="justdone"}
  else if(!all&&l.status==="archived"){next.status="active";next.archivedAt=null;st.banner=null}
  saveList(next);render();
}
function move(l,a,b){const items=[...l.items];items.splice(b,0,items.splice(a,1)[0]);saveList({...l,items});render()}
function reopen(l){saveList({...l,status:"active",archivedAt:null});st.banner=null;if(st.view==="home")render();else render()}
async function deleteList(l){
  st.confirm=null;
  lists=lists.filter(x=>x.id!==l.id);
  if(st.openId===l.id){st.view="home";st.openId=null}
  render();
  try{await (writes[l.id]||Promise.resolve());await db.doc("lists/"+l.id).delete();
    if(assets)for(const a of (l.photos||[])){try{await assets.delete(a)}catch(e){console.error(e)}}
  }catch(e){fail(e)}
}

render();
(async()=>{
  if(!window.claude||!window.claude.use){dbFailed=true;setSync("Sync unavailable","bad");render();return}
  const [d,a,s]=await Promise.all([window.claude.use("db"),window.claude.use("assets"),window.claude.use("sample")]);
  db=d;assets=a;sample=s;
  if(sample){try{const lim=await sample.limits();imgLimits=lim&&lim.images||null}catch(e){imgLimits=null}}
  if(!db){dbFailed=true;setSync("Sync unavailable: sign in to claude.ai","bad");render();return}
  db.collection("lists").onSnapshot(snap=>{
    lists=snap.docs.map(x=>({id:x.id,...x.data()}));
    if(!live){live=true;setSync("Saved on this phone","ok")}
    schedule();
  },e=>{console.error(e);setSync(e.code==="revoked"?"Access changed: reload the page":"Connection lost: reload the page","bad")});
})();
</script>

<script>
(function(){
  const S=window.__listitStore,msg=t=>{document.getElementById("bk-msg").textContent=t};
  document.getElementById("bk-export").addEventListener("click",async()=>{
    const data={app:"List It",version:1,exportedAt:new Date().toISOString(),lists:S.load()};
    const n=Object.keys(data.lists).length;
    const name="list-it-backup-"+new Date().toISOString().slice(0,10)+".json";
    const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});
    try{
      const file=new File([blob],name,{type:"application/json"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});msg("Backup of "+n+" list"+(n===1?"":"s")+" ready to save.");return}
    }catch(e){if(e&&e.name==="AbortError")return}
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
    msg("Backup of "+n+" list"+(n===1?"":"s")+" saved as "+name+".");
  });
  document.getElementById("bk-import").addEventListener("change",async e=>{
    const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
    try{
      const d=JSON.parse(await f.text());const incoming=d&&d.lists;
      if(!incoming||typeof incoming!=="object")throw new Error("not a List It backup");
      const cur=S.load();let added=0,updated=0;
      for(const[id,l] of Object.entries(incoming)){if(cur[id])updated++;else added++;cur[id]=l}
      S.store(cur);S.emit();
      msg("Restored: "+added+" new list"+(added===1?"":"s")+", "+updated+" replaced. Lists only on this phone were kept.");
    }catch(err){msg("That file isn't a List It backup. Pick a file named list-it-backup-….json.")}
  });
})();
</script>
